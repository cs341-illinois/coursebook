name: Coursebook Build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_focus: [WIKI, EPUB, PDF]
    env:
      BUILD_FOCUS: ${{ matrix.build_focus }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Python 3.7 has no build for ubuntu-24.04 or 26.04, so setup-python
    # could not find it. 3.11 has builds for 22.04, 24.04 and 26.04, and
    # works with panflute 1.12.5, which still targets pandoc 2.7's AST.
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install
      run: |
        bash _scripts/install.sh

    - name: Build coursebook
      run: |
        bash _scripts/script.sh
