name: Coursebook Build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_focus: [WIKI, EPUB, PDF]
    env:
      BUILD_FOCUS: ${{ matrix.build_focus }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Python 3.7 has no build for ubuntu-24.04 (which ubuntu-latest now
    # points at), so setup-python could not find it. 3.9 is the newest
    # release that still works with the pinned panflute 1.10.6, which
    # imports MutableSequence from collections (removed in 3.10).
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install
      run: |
        bash _scripts/install.sh

    - name: Build coursebook
      run: |
        bash _scripts/script.sh
