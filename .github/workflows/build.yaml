name: Coursebook Build

on:
  pull_request:
    branches:
      - master

# A PR build has no side effects, so superseding one is always safe:
# when someone pushes a fixup commit, kill the run for the old commit
# rather than paying for a 9 minute PDF build nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-alt-text:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check figure alt text
      run: python3 _scripts/check_alt_text.py

    - name: Test figure alt-text lint
      run: python3 -m unittest discover -s _scripts -p 'test_check_alt_text.py'

  pandoc-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout pre-upgrade baseline
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: baseline

    - name: Checkout pull request head
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: current

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          baseline/requirements.txt
          current/requirements.txt

    - name: Setup Java for EPUBCheck
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Pandoc 2.7 baseline tools
      run: |
        python -m venv "$RUNNER_TEMP/pandoc27"
        "$RUNNER_TEMP/pandoc27/bin/pip" install -r baseline/requirements.txt
        curl --fail --location --retry 3 \
          https://github.com/jgm/pandoc/releases/download/2.7/pandoc-2.7-1-amd64.deb \
          --output "$RUNNER_TEMP/pandoc-2.7.deb"
        dpkg-deb -x "$RUNNER_TEMP/pandoc-2.7.deb" "$RUNNER_TEMP/pandoc27"

    - name: Build and capture Pandoc 2.7 baseline
      working-directory: baseline
      run: |
        export PATH="$RUNNER_TEMP/pandoc27/bin:$RUNNER_TEMP/pandoc27/usr/bin:$PATH"
        pandoc --version
        make epub
        python3 _scripts/gen_wiki.py order.yaml _wiki
        pandoc -f latex -t json main.tex -o pandoc27-main.json

    - name: Upload pre-upgrade artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pandoc-2.7-baseline
        path: |
          baseline/main.epub
          baseline/_wiki/**
          baseline/pandoc27-main.json
        retention-days: 90

    - name: Install Pandoc 3.10.2 candidate tools
      run: |
        python -m venv "$RUNNER_TEMP/pandoc310"
        "$RUNNER_TEMP/pandoc310/bin/pip" install -r current/requirements.txt
        curl --fail --location --retry 3 \
          https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb \
          --output "$RUNNER_TEMP/pandoc-3.10.2.deb"
        dpkg-deb -x "$RUNNER_TEMP/pandoc-3.10.2.deb" "$RUNNER_TEMP/pandoc310"
        curl --fail --location --retry 3 \
          https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
          --output "$RUNNER_TEMP/epubcheck-5.4.0.zip"
        python -m zipfile -e "$RUNNER_TEMP/epubcheck-5.4.0.zip" "$RUNNER_TEMP/epubcheck"

    - name: Test Pandoc 3 filters (A1)
      working-directory: current
      run: |
        export PATH="$RUNNER_TEMP/pandoc310/bin:$RUNNER_TEMP/pandoc310/usr/bin:$PATH"
        python3 _scripts/test_pandoc_filters.py

    - name: Build and validate EPUB (A2, A2b)
      working-directory: current
      run: |
        export PATH="$RUNNER_TEMP/pandoc310/bin:$RUNNER_TEMP/pandoc310/usr/bin:$PATH"
        make epub
        python3 _scripts/validate_alt_text_outputs.py epub main.epub
        java -jar "$RUNNER_TEMP/epubcheck/epubcheck-5.4.0/epubcheck.jar" main.epub

    - name: Build and validate wiki (A3)
      working-directory: current
      run: |
        export PATH="$RUNNER_TEMP/pandoc310/bin:$RUNNER_TEMP/pandoc310/usr/bin:$PATH"
        mkdir -p _wiki
        python3 _scripts/gen_wiki.py order.yaml _wiki
        python3 _scripts/validate_alt_text_outputs.py wiki _wiki

    - name: Compare Pandoc ASTs and citation output (A4)
      working-directory: current
      run: |
        export PATH="$RUNNER_TEMP/pandoc310/bin:$RUNNER_TEMP/pandoc310/usr/bin:$PATH"
        pandoc -f latex -t json main.tex -o pandoc310-main.json
        python3 _scripts/compare_pandoc_ast.py \
          ../baseline/pandoc27-main.json pandoc310-main.json \
          --wiki-dir _wiki --report-file pandoc310-ast-report.md

    - name: Upload Pandoc 3 audit artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pandoc-3.10.2-audit
        path: |
          current/main.epub
          current/_wiki/**
          current/pandoc310-main.json
          current/pandoc310-ast-report.md
        retention-days: 90

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # The three outputs are independent, and PDF is by far the slowest.
      # With the default fail-fast, a WIKI failure 90 seconds in cancels
      # the 9 minute PDF job, so the run tells you nothing about whether
      # the PDF is healthy and the next push has to rediscover it.
      fail-fast: false
      matrix:
        build_focus: [WIKI, EPUB, PDF]
    env:
      BUILD_FOCUS: ${{ matrix.build_focus }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Python 3.11 is supported on the current Ubuntu runners and by the
    # pinned panflute 2.3.1 used with Pandoc 3.10.2.
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install
      run: |
        bash _scripts/install.sh

    - name: Build coursebook
      run: |
        bash _scripts/script.sh

    - name: Validate EPUB accessibility
      if: matrix.build_focus == 'EPUB'
      run: python3 _scripts/validate_alt_text_outputs.py epub main.epub

    - name: Validate wiki accessibility
      if: matrix.build_focus == 'WIKI'
      run: python3 _scripts/validate_alt_text_outputs.py wiki _wiki
