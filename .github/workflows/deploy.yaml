name: Coursebook Deploy

on:
  push:
    branches:
      - master

# Deploy pushes the wiki, force-pushes epub_deploy and pdf_deploy, and
# nudges the website repo. Cancelling that halfway through can leave the
# three deploy targets on different commits, so cancel-in-progress stays
# FALSE: a second push to master queues behind the first instead of
# killing it. GitHub keeps at most one run pending per group, so a burst
# of pushes still collapses to "the run in flight, then the newest one" --
# the intermediate ones are dropped before they start, which costs
# nothing and is safe because only the newest commit needs deploying.
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Needed so the built-in GITHUB_TOKEN can push the deploy branches
    # and the wiki.
    permissions:
      contents: write

    strategy:
      # WIKI, EPUB and PDF deploy to three independent targets. With
      # the default fail-fast a WIKI failure cancels the PDF job, so
      # pdf_deploy silently goes stale even though the PDF was fine.
      fail-fast: false
      matrix:
        build_focus: [WIKI, EPUB, PDF]
    env:
      BUILD_FOCUS: ${{ matrix.build_focus }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Python 3.11 is supported on the current Ubuntu runners and by the
    # pinned panflute 2.3.1 used with Pandoc 3.10.2.
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install
      run: |
        bash _scripts/install.sh

    - name: Build coursebook
      run: |
        bash _scripts/script.sh

    - name: Validate EPUB accessibility
      if: matrix.build_focus == 'EPUB'
      run: python3 _scripts/validate_alt_text_outputs.py epub main.epub

    - name: Validate wiki accessibility
      if: matrix.build_focus == 'WIKI'
      run: python3 _scripts/validate_alt_text_outputs.py wiki _wiki

    - name: Deploy site
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
      run: |
        # https://github.community/t/github-actions-bot-email-address/17204/6
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "Github Actions Bot"

        export COMMITTER_EMAIL="github-actions@github.com"
        export AUTHOR_NAME="Github Actions"

        # The encrypted deploy keys below no longer authenticate: the repo
        # has no deploy keys registered at all, so every push failed with
        # "git@github.com: Permission denied (publickey)". They were most
        # likely dropped when the org was renamed illinois-cs241 ->
        # cs341-illinois. We now push with the built-in GITHUB_TOKEN
        # instead, which needs no secret to rotate and survives renames.
        #
        # Needed to add the --no-tty --batch --yes flags to get gpg to work in Github Actions
        # Based on this: https://discuss.circleci.com/t/error-sending-to-agent-inappropriate-ioctl-for-device/17465/3
        # gpg --no-tty --batch --yes --passphrase ${{ secrets.GPG_PASSPHRASE }} --output /tmp/deploy_site --decrypt site-deploy.enc
        # gpg --no-tty --batch --yes --passphrase ${{ secrets.GPG_PASSPHRASE }} --output /tmp/deploy_wiki --decrypt wiki-deploy.enc
        #
        # eval "$(ssh-agent -s)"
        # chmod 600 /tmp/deploy_site
        # chmod 600 /tmp/deploy_wiki

        # Install the website deploy key so site_deploy.sh can nudge the
        # site into rebuilding. GITHUB_TOKEN cannot do this: it is scoped
        # to this repo, and pushes made with it deliberately do not
        # trigger workflows. A deploy key has no expiry and is exempt
        # from the org's SAML SSO. If the secret is absent (a fork, say)
        # the site deploy is skipped rather than failing the run.
        if [ -n "$SITE_DEPLOY_KEY" ]; then
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$SITE_DEPLOY_KEY" > /tmp/deploy_site
          chmod 600 /tmp/deploy_site
        else
          echo "SITE_DEPLOY_KEY not set - the site deploy will be skipped"
        fi

        bash _scripts/deploy.sh

    - name: Checkout source for post-deploy validation
      if: matrix.build_focus == 'EPUB' || matrix.build_focus == 'WIKI'
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: source

    - name: Checkout deployed EPUB branch
      if: matrix.build_focus == 'EPUB'
      uses: actions/checkout@v4
      with:
        ref: epub_deploy
        path: deployed-epub

    - name: Validate deployed EPUB
      if: matrix.build_focus == 'EPUB'
      run: python3 source/_scripts/validate_alt_text_outputs.py epub deployed-epub/main.epub --root source

    - name: Clone deployed wiki
      if: matrix.build_focus == 'WIKI'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/deployed-wiki"

    - name: Validate deployed wiki
      if: matrix.build_focus == 'WIKI'
      run: python3 source/_scripts/validate_alt_text_outputs.py wiki "$RUNNER_TEMP/deployed-wiki" --root source
